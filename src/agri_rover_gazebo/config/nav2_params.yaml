amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: /scan

    laser_min_range: 0.12
    laser_max_range: 10.0
    laser_max_beams: 360

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.05
    update_min_a: 0.05

    transform_tolerance: 1.0

    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/manasvi/agri_rover_ws/src/agri_rover_gazebo/maps/agri_field_map.yaml


planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: false
      allow_unknown: false


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 10.0

    enable_stamped_cmd_vel: true

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 20.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      desired_linear_vel: 0.15

      max_linear_accel: 0.5
      max_linear_decel: 0.5

      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.60
      lookahead_time: 1.5

      rotate_to_heading_angular_vel: 0.3
      max_angular_accel: 0.5

      use_velocity_scaled_lookahead_dist: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true

      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.05

      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785

      allow_reversing: false

      transform_tolerance: 0.2

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      resolution: 0.05

      robot_radius: 0.25

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan

          marking: true
          clearing: true

          obstacle_min_range: 0.12
          obstacle_max_range: 8.0

          raytrace_min_range: 0.12
          raytrace_max_range: 10.0

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

        inflation_radius: 0.35
        cost_scaling_factor: 3.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05

      robot_radius: 0.25

      track_unknown_space: false

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan

          marking: true
          clearing: true

          obstacle_min_range: 0.12
          obstacle_max_range: 8.0

          raytrace_min_range: 0.12
          raytrace_max_range: 10.0

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

        inflation_radius: 0.35
        cost_scaling_factor: 3.0


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_link

    odom_topic: /diff_drive_controller/odom

    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml

    default_nav_through_poses_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml

behavior_server:
  ros__parameters:
    use_sim_time: true

    enable_stamped_cmd_vel: true

    local_costmap_topic: /local_costmap/costmap_raw
    global_costmap_topic: /global_costmap/costmap_raw

    local_footprint_topic: /local_costmap/published_footprint
    global_footprint_topic: /global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait

    global_frame: odom
    robot_base_frame: base_link

    transform_tolerance: 0.1

    simulate_ahead_time: 2.0

    max_rotational_vel: 0.3
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.5


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 1000


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0

    scale_velocities: false

    feedback: OPEN_LOOP

    max_velocity:
      - 0.20
      - 0.0
      - 0.50

    min_velocity:
      - -0.20
      - 0.0
      - -0.50

    max_accel:
      - 0.5
      - 0.0
      - 1.0

    min_decel:
      - -0.5
      - 0.0
      - -1.0

    odom_topic: /diff_drive_controller/odom

    odom_duration: 0.1

    velocity_timeout: 1.0

    enable_stamped_cmd_vel: true
